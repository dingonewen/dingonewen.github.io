<div class="container intro-container">
  <h3 id="{{ site.about_title | slugify | default: 'about-me' }}">{{ site.about_title | default:
  "About Me" }}</h3>
  <div class="row clearfix">
    {%- if site.about_profile_image -%}
      <div class="col-xs-12 col-sm-4 col-md-3 no-print">
        <span class="profile-img" style="background-image: url({{ site.about_profile_image | relative_url }})"></span>
        <div class="resume-menu">
          <button class="resume-trigger" type="button" aria-expanded="false" aria-controls="resume-options">
            <span class="resume-label">RESUME</span>
            <span class="resume-chevron" aria-hidden="true"></span>
          </button>
          <div class="resume-options" id="resume-options" hidden>
            <a href="{{ site.resume_sde_url | relative_url }}" download>
              <span>SDE Resume</span><i class="fa-solid fa-file-arrow-down resume-option-icon" aria-hidden="true"></i>
            </a>
            <a href="{{ site.resume_tpm_url | relative_url }}" download>
              <span>TPM Resume</span><i class="fa-solid fa-file-arrow-down resume-option-icon" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </div>
    {%- endif -%}
    <div class="{{ 'col-xs-12 ' }}{%- if site.about_profile_image -%}col-sm-8 col-md-9 col-print-12{%- endif -%}">
      {{ site.about_content | strip | markdownify }}
    </div>
  </div>
</div>
