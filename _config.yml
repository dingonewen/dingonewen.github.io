# About Section
about_title: Generally Speaking
about_profile_image: images/weixinphoto.jpg
about_content: | # this will include new lines to allow paragraphs
  <p style="text-indent: 2em;">
  I'm a <mark>builder who communicates</mark>. I write code for <strong>autonomous agents</strong>, <strong>RAG pipelines</strong>, and <strong>full-stack AI systems</strong> — but I also know that the best architecture diagram is worthless if nobody in the room understands it. I'm a <mark>high-signal communicator</mark>: brevity, precision, and the occasional well-timed joke to remind everyone we're building software, not performing surgery. I've bridged gaps between engineers, business stakeholders, clinicians, and regulators — and I genuinely enjoy the translation work most people find exhausting.
  </p>

  <p style="text-indent: 2em;">
  My foundation is deliberately multi-disciplinary. I started in <strong>physics</strong>, earned a <strong>BEng</strong> and <strong>BS</strong> in <strong>food science & engineering</strong> at <strong>CAU</strong> and <strong>Cornell</strong>, and spent three years in life sciences operations managing global partnerships and clinical research pipelines. Thermodynamics, fluid mechanics, process control, regulatory compliance, cross-functional coordination — none of it was "tech," all of it was training. Controlling volatile biological systems taught me to think in systems, and managing stakeholders across continents taught me to communicate with precision. Both skills transfer directly to building deterministic software and shipping AI products on non-deterministic infrastructure.
  </p>

  <p style="text-indent: 2em;">
  Currently at <strong>Penn Engineering</strong>, I'm pursuing a master's in computer science with coursework in machine learning and distributed systems, while building agentic workflows, MCP integrations, and production-grade LLM applications. I also call myself a <mark>Humor Retriever</mark> — loyal to the joke, always chasing the laugh, and deeply committed to the belief that if you can't explain a complex model with a smile, you don't understand it well enough. If you want to talk hybrid search, RAG optimization, system design, or why most meetings could have been a well-structured email — my inbox is open.
  </p>
