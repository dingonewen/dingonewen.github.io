  - title: More About Me          
    layout: text
    content: | # this will include new lines to allow paragraphs
      <img src="/images/soccerfood.jpg" alt="Soccer and Food" loading="lazy" style="float: right; margin: 0 0 15px 15px; border-radius: 8px;">

      <p style="text-indent: 2em;">I thrive on structure and discipline, yet I’m easily won over by the simple things in life: quality sleep, a great soccer match, and the occasional windfall of <em>free food</em>.</p>
    
      <p style="text-indent: 2em;">Long before I immersed myself in science, my world was defined by the 19x19 grid of a <strong>Go board</strong>. As a semi-professional player, I became one of the top-ranked female players in my province by the age of 10, a milestone built on years of strategic thinking and relentless practice. When AlphaGo emerged, it didn't discourage me; instead, it shifted my fascination from the game to the machine. Transitioning into tech felt less like changing paths and more like continuing the same high-stakes match, just against a different kind of opponent.</p>
    
      <p style="text-indent: 2em;">To keep my mental focus sharp, I maintain a strict physical routine. I’ve traded high-impact sports for high-consistency swimming to preserve my joints, 25km freestyle every month. For me, swimming is the ultimate "low-latency" activity for sustained cognitive performance. I draw constant motivation from athletes like <a href="https://www.f-zd.com/" target="_blank">Fan Zhendong</a>, <a href="https://www.espn.com/mma/fighter/_/id/4350762/zhang-weili" target="_blank">Zhang Weili</a>, and <a href="https://kylianmbappe.com/en/" target="_blank">Kylian Mbappé</a>. Their resilience reminds me that dedication is a universal language, whether you're on the pitch or at a terminal.</p>
    
      <p style="text-indent: 2em;">I’m a staunch advocate for the "early to bed, early to rise" lifestyle, having maintained such a biological clock that hasn’t wavered for almost two decades. During my focused hours, I usually have <a href="https://khalilfong.com/2017/" target="_blank">Khalil Fong</a>’s mellow tracks on loop. I’ve always admired his calm professionalism and kindness, qualities I strive to bring into my own development work.</p>
    
      <p style="text-indent: 2em;">Beyond the screen, I’m a <strong>certified BLS provider</strong>. Earning that certification was a grounding reminder that impact exists outside of grades and deadlines. It’s about being prepared to contribute when every second actually counts.</p>
    
      <p style="text-indent: 2em;"><em>Cooking</em> is my final ritual for balance. Having spent years in <strong>Food Science</strong>, I treat my body like a high-stakes lab experiment: alcohol is strictly blacklisted, while sugar, dairy, and caffeine are on permanent probation. Crafting healthy, grounding meals is how I stay connected to my roots. However, all my dietary principles vanish the moment someone mentions "free food". I have a secret, undeniable weakness for Basque cheesecake and triple chocolate cookies.</p>

      <p style="text-indent: 2em;">As I said, <em>Soccer</em> is the latest spark in my professional journey. This May, I am joining the <strong>Accreditation Operations Support</strong> team for the <strong>FIFA World Cup 2026</strong> in Philly, bringing my obsession with process optimization to the world’s biggest stage. Having managed complex biotech pipelines and medical protocols, I treat high-volume credentialing like a mission-critical deployment: security standards are the source code, and workflow efficiency is the non-negotiable KPI. It is the ultimate collision of my technical discipline and my lifelong love for the "beautiful game." However, my professional composure is highly vulnerable to a perfectly executed bicycle kick; I might be verifying your identity, but my heart is definitely on the pitch.</p>

      <p style="text-indent: 2em;">It’s worth mentioning that this summer I’ve been trying both a strict low-GI diet and moderate-intensity aerobic exercise to improve my physique and overall well-being.</p>
